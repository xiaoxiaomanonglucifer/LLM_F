# v2 配置：严格湖南·非法占地行政处罚
# 用法：export LEGAL_RAG_SETTINGS=config/settings_v2.yaml
# 与 v1 完全隔离：v1 的 75 部法规与索引保持冻结，v2 只含国家核心法 + 湖南地方立法。
paths:
  data_dir: data/v2
  raw_dir: data/v2/raw
  meta_dir: data/v2/meta
  documents_file: data/v2/documents.jsonl
  articles_file: data/v2/articles.jsonl
  manifest_file: data/v2/manifest.json
  corpus_stats_file: data/v2/corpus_stats.json
  catalog_file: config/corpus_catalog_v2.yaml
  index_dir: data/v2/index
  chroma_dir: data/v2/index/chroma
  bm25_file: data/v2/index/bm25.pkl
  graph_dir: data/v2/graph
  cases_dir: data/cases/v1
  case_catalog_file: config/case_catalog.yaml
  results_dir: results

corpus:
  request_interval_sec: 1.2
  request_timeout_sec: 60
  max_retries: 4
  user_agent: "legal-rag-course-project/2.0 (Yunnan University; R2 Hunan illegal-land corpus)"

embedding:
  model: BAAI/bge-m3
  batch_size: 16
  normalize: true
  device: cuda
  max_seq_length: 512

vector_store:
  provider: chroma
  collection: legal_articles_hn_v2
  distance: cosine

bm25:
  k1: 1.5
  b: 0.75
  use_char_bigram: true

retrieval:
  top_k: 5
  candidate_k: 30
  rrf_k: 60
  g1_signals: [dense, bm25]
  g2_signals: [dense, bm25, graph, case]
  case_top_k: 3

generation:
  base_url: http://127.0.0.1:8000/v1
  api_key: not-needed
  model: Qwen/Qwen2.5-7B-Instruct
  backend: vllm
  # 共享 GPU 显存不足，服务加载 Qwen2.5-7B-Instruct-AWQ（int4）；留空表示 bf16 原权重
  quantization: awq-int4
  temperature: 0.1
  top_p: 0.9
  seed: 42
  max_tokens: 1024
  timeout_sec: 300
  max_retries: 2

query_rewrite:
  enabled: true
  use_llm: false

graph:
  uri: bolt://127.0.0.1:7687
  user: neo4j
  database: neo4j
  max_hops: 1
  extract_model: qwen2.5:7b-instruct
  extract_batch_articles: 8

evaluation:
  cases_file: data/cases/v1/cases.jsonl
  case_questions_file: data/cases/v1/questions.jsonl
  output_format_version: "2.1"
