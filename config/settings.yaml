# v1 全局配置（R2 维护）
# 口径：全国性国土资源相关法律/行政法规 + 云南省/昆明市相关地方性法规。
# 使用方式：LEGAL_RAG_SETTINGS=config/settings.yaml <命令>
# 注意：检索/生成参数已固定，任何变动需登记 CHANGELOG。
paths:
  data_dir: data/v1
  raw_dir: data/v1/raw
  meta_dir: data/v1/meta
  documents_file: data/v1/documents.jsonl
  articles_file: data/v1/articles.jsonl
  manifest_file: data/v1/manifest.json
  corpus_stats_file: data/v1/corpus_stats.json
  catalog_file: config/corpus_catalog.yaml
  index_dir: data/v1/index
  chroma_dir: data/v1/index/chroma
  bm25_file: data/v1/index/bm25.pkl
  graph_dir: data/v1/graph
  results_dir: results

corpus:
  request_interval_sec: 1.2
  request_timeout_sec: 60
  max_retries: 4
  user_agent: "legal-rag-course-project/1.0 (Yunnan University; R2 corpus build)"

embedding:
  # 正式实验固定 BGE-M3（1024 维）；本地无权重时可用 --embedding-model 覆盖
  model: BAAI/bge-m3
  batch_size: 16
  normalize: true
  device: cuda
  max_seq_length: 512

vector_store:
  provider: chroma
  collection: legal_articles_v1
  distance: cosine

bm25:
  k1: 1.5
  b: 0.75
  use_char_bigram: true

retrieval:
  top_k: 5
  candidate_k: 30
  rrf_k: 60
  g1_signals: [dense, bm25]
  g2_signals: [dense, bm25, graph]

generation:
  base_url: http://127.0.0.1:8000/v1
  api_key: not-needed
  model: Qwen/Qwen2.5-7B-Instruct
  backend: vllm
  quantization: awq-int4
  temperature: 0.1
  top_p: 0.9
  seed: 42
  max_tokens: 1024
  timeout_sec: 300
  max_retries: 2

query_rewrite:
  enabled: true
  use_llm: false

graph:
  uri: bolt://127.0.0.1:7687
  user: neo4j
  database: neo4j
  max_hops: 1
  extract_model: qwen2.5:7b-instruct
  extract_batch_articles: 8

evaluation:
  questions_file: data/eval/v1/questions.jsonl
  output_format_version: "1.0"
